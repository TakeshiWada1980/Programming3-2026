<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />

    <script>
      MathJax = {
        chtml: {
          displayAlign: "left",
          displayIndent: "1em",
        },
      };
    </script>

    $if(math)$ $math$ $endif$

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="site.js" defer></script>

    <title>$title$</title>
  </head>

  <body>
    <button
      type="button"
      class="openbtn"
      aria-label="目次を開く"
      aria-controls="g-nav"
      aria-expanded="false"
    >
      <span></span><span></span><span></span>
    </button>
    <nav id="g-nav" aria-hidden="true">
      <div id="g-nav-list">
        <!-- ---------------------------------------- -->
        $if(table-of-contents)$ $table-of-contents$ $endif$
        <!-- ---------------------------------------- -->
      </div>
    </nav>

    <header class="markdown-body">
      <p>$var.header-title$</p>
      <p>$var.header-date$</p>
    </header>

    <main class="markdown-body">
      <!-- ---------------------------------------- -->
      $body$
      <!-- ---------------------------------------- -->
    </main>

    <footer class="markdown-body">
      <p><a href="$base-url$">講義資料のIndexに移動</a></p>
    </footer>

  </body>
</html>
